[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "github-radar"
version = "0.1.0"
description = "A daily GitHub Trending report with reproducible source snapshots"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<0.29",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.11,<3",
]

[project.scripts]
github-radar = "github_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
github_radar = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".superpowers", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
