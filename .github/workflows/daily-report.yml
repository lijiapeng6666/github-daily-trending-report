name: Daily Report

on:
  schedule:
    - cron: '17 0 * * *' # 08:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-report-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: uv sync --frozen
      - name: Check code before collecting
        run: |
          uv run --frozen pytest
          node --test tests/filters.test.cjs
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Restore persistent history
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          HISTORY_CHECKOUT: ${{ runner.temp }}/radar-history
        run: >-
          uv run --frozen python -m github_radar.history restore
          --remote "$HISTORY_REMOTE" --checkout "$HISTORY_CHECKOUT"
      - name: Generate daily report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen github-radar generate
      - name: Save persistent history
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_CHECKOUT: ${{ runner.temp }}/radar-history
        run: >-
          uv run --frozen python -m github_radar.history save
          --checkout "$HISTORY_CHECKOUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
